---
role_name_check: 1
dependency:
  name: galaxy
driver:
  name: vagrant
platforms:
  - name: trixie
    groups:
      - family_debian
    children:
      - debian
    box: bento/debian-13
    memory: 1024
    cpus: 1
    provider_options:
      gui: false
  - name: bookworm
    groups:
      - family_debian
    children:
      - debian
    box: bento/debian-12
    memory: 1024
    cpus: 1
    provider_options:
      gui: false
provisioner:
  name: ansible
  options:
    diff: true
  config_options:
    defaults:
      hash_behaviour: merge
      callback_result_format: yaml
    ssh_connection:
      pipelining: true
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
verifier:
  name: ansible
scenario:
  ## cleanupとside_effectはドライバにプレイブックが無いため実行しません
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence
    - verify
    - destroy
