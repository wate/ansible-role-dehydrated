---
- name: Find platform variable file
  ansible.builtin.set_fact:
    variable_file: "{{ lookup('first_found', params, errors='ignore') }}"
  vars:
    params:
      files:
        - "{{ ansible_facts.os_family }}/{{ ansible_facts.distribution }}/{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.os_family }}/{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - vars
  tags: role_dehydrated_include_vars
- name: Include variable file
  ansible.builtin.include_vars:
    file: "{{ variable_file }}"
  when:
    - variable_file is not none
    - variable_file | length > 0
  tags: role_dehydrated_include_vars
- name: Install dehydrated
  ansible.builtin.apt:
    name:
      - dehydrated
      - cron
- name: Install lexicon (auto apt/pip)
  when: dehydrated_with_lexicon
  block:
    - name: Resolve lexicon install method
      when: dehydrated_lexicon_install_method == 'auto'
      block:
        - name: Detect lexicon availability (APT)
          ansible.builtin.command:
            cmd: apt-cache show lexicon
          changed_when: false
          failed_when: false
          register: lexicon_apt_cache
        - name: Set lexicon install method (auto)
          ansible.builtin.set_fact:
            dehydrated_lexicon_install_method_resolved: "{{ 'apt' if (lexicon_apt_cache.rc == 0 and lexicon_apt_cache.stdout | length > 0) else 'pip' }}"
    - name: Set lexicon install method (explicit)
      ansible.builtin.set_fact:
        dehydrated_lexicon_install_method_resolved: "{{ dehydrated_lexicon_install_method }}"
      when: dehydrated_lexicon_install_method != 'auto'
    - name: Install lexicon via apt
      ansible.builtin.apt:
        name: "{{ dehydrated_lexicon_packages }}"
      when: dehydrated_lexicon_install_method_resolved == 'apt'
    - name: Install lexicon via pipx
      when: dehydrated_lexicon_install_method_resolved == 'pip'
      block:
        - name: Install pipx
          ansible.builtin.apt:
            name: pipx
        - name: Install dns-lexicon with pipx
          community.general.pipx:
            name: dns-lexicon
            state: present
            global: true
        - name: Inject optional packages into dns-lexicon environment
          community.general.pipx:
            name: dns-lexicon
            inject_packages: "{{ dehydrated_lexicon_pip_inject_packages }}"
            state: inject
            global: true
          when: dehydrated_lexicon_pip_inject_packages | length > 0
- name: Create additional config file
  ansible.builtin.template:
    src: local.sh.j2
    dest: /etc/dehydrated/conf.d/local.sh
    mode: "0644"
- name: Create domain file
  ansible.builtin.template:
    src: domains.txt.j2
    dest: /etc/dehydrated/domains.txt
    mode: "0644"
- name: Create hook file
  ansible.builtin.template:
    src: hook.sh.j2
    dest: /etc/dehydrated/hook.sh
    mode: "0750"
- name: Register account key
  ansible.builtin.command:
    cmd: dehydrated --register --accept-terms
    creates: /var/lib/dehydrated/accounts
- name: Create auth file directory
  ansible.builtin.file:
    path: /var/www/dehydrated
    state: directory
    mode: "0755"
- name: Sign/renew non-existent/changed/expiring certificates
  ansible.builtin.command:
    cmd: dehydrated --cron
  when: dehydrated_auto_execute
- name: Register cron job
  ansible.builtin.cron:
    name: Update SSL certificate
    job: "{{ dehydrated_cron.job }}"
    hour: "{{ dehydrated_cron.hour | string }}"
    minute: "{{ dehydrated_cron.minute | string }}"
